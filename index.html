<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruchita Saree Aura</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* সাধারণ রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* মেইন কন্টেন্ট এরিয়া */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
        }

        /* ফুটার স্টাইল (গাঢ় ব্রাউন) */
        .custom-footer {
            background-color: #2b1e16; 
            color: #d1cbc5;
            padding: 60px 20px 20px;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ৩ কলামের গ্রিড লেআউট */
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }

        /* হেডিং স্টাইল (হলুদ) */
        .footer-col h4 {
            color: #f3b63f; 
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* টেক্সট ও আইকন */
        .footer-col p, 
        .footer-col a {
            font-size: 14px;
            color: #d1cbc5;
            line-height: 1.8;
            text-decoration: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .footer-col a:hover {
            color: #f3b63f;
        }

        .footer-col i {
            color: #a89b91;
            margin-top: 5px;
            font-size: 14px;
            width: 16px;
            text-align: center;
        }

        /* ঠিকানা */
        .address-text {
            font-size: 14px;
            line-height: 1.8;
            color: #d1cbc5;
            padding-left: 25px;
        }

        .check-icon {
            color: #d1cbc5 !important;
        }

        /* কপিরাইট */
        .footer-bottom {
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid #423328;
            font-size: 12px;
            color: #8c7d73;
        }

        /* মোবাইল রেসপন্সিভ */
        @media (max-width: 768px) {
            .footer-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .custom-footer {
                padding: 40px 20px 20px;
            }
        }
    </style>
</head>
<body>

    <main>
        <h2>Welcome to Ruchita Saree Aura</h2>
    </main>

    <!-- ফুটার সেকশন -->
    <footer class="custom-footer">
        <div class="footer-container">
            
            <div class="footer-grid">
                
                <!-- ১. যোগাযোগ -->
                <div class="footer-col">
                    <h4><i class="fas fa-phone-alt"></i> যোগাযোগ</h4>
                    <a href="tel:+8801885092595"><i class="fas fa-phone"></i> +880 1885-092595</a>
                    <a href="mailto:ruchitasaree0622@gmail.com"><i class="fas fa-envelope"></i> ruchitasaree0622@gmail.com</a>
                </div>

                <!-- ২. ঠিকানা -->
                <div class="footer-col">
                    <h4><i class="fas fa-map-marker-alt"></i> ঠিকানা</h4>
                    <div class="address-text">
                        ক্লিডি™ Ruchita Saree Aura<br>
                        Shekertek 10, Adabar<br>
                        Dhaka 1207, Bangladesh
                    </div>
                </div>

                <!-- ৩. শিপিং ও রিটার্ন -->
                <div class="footer-col">
                    <h4><i class="fas fa-truck"></i> শিপিং ও রিটার্ন</h4>
                    <p><i class="fas fa-check check-icon"></i> ঢাকার মধ্যে: ৳৮০</p>
                    <p><i class="fas fa-check check-icon"></i> ঢাকার বাইরে: ৳১২০</p>
                    <p><i class="fas fa-check check-icon"></i> 7-Day Return & Exchange</p>
                </div>

            </div>

            <!-- কপিরাইট -->
            <div class="footer-bottom">
                &copy; 2026 Ruchita Saree Aura. All Rights Reserved.
            </div>

        </div>
    </footer>

</body>
</html>
